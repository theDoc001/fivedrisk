[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fivedrisk"
version = "0.7.0"
description = "Per-action AI agent risk scoring and governance: 5-dimension scoring, HITL enforcement, Markov drift detection, injection scanning, and auditable decision logs."
readme = { file = "fivedrisk/README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Loren Angoni" }
]
keywords = [
    "ai-safety", "ai-governance", "agent-safety", "llm-safety",
    "prompt-injection", "hitl", "risk-scoring", "audit-log",
    "markov-drift", "owasp", "langgraph", "claude", "anthropic"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.3",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/theDoc001/fivedrisk"
Repository = "https://github.com/theDoc001/fivedrisk"
"Bug Tracker" = "https://github.com/theDoc001/fivedrisk/issues"
Changelog = "https://github.com/theDoc001/fivedrisk/blob/main/CHANGELOG.md"

[project.scripts]
fivedrisk = "fivedrisk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fivedrisk*"]

[tool.setuptools.package-data]
# Low-19: ship tests/golden_set/*.json so test_golden_set passes from an installed
# wheel (the fivedrisk.tests package itself is packaged).
fivedrisk = ["*.yaml", "fixtures/**/*", "policies/presets/*.yaml", "tests/golden_set/*.json"]

[tool.pytest.ini_options]
testpaths = ["fivedrisk/tests"]
# NOTE: the suite has ZERO collected async tests (all `async def` helpers run via
# asyncio.run() inside sync tests), so pytest-asyncio is intentionally NOT a test
# dep and `asyncio_mode` is not set — the plugin's collection hooks broke CI under
# pytest 9.x (exit-2 collection error) for no benefit. Re-add both together only if
# a real `async def test_*` / @pytest.mark.asyncio test is introduced.
markers = [
    "llm01_prompt_injection: tests covering OWASP LLM01 (Prompt Injection)",
    "llm02_insecure_output: tests covering OWASP LLM02 (Insecure Output Handling)",
    "llm04_model_dos: tests covering OWASP LLM04 (Model Denial of Service)",
    "llm06_sensitive_disclosure: tests covering OWASP LLM06 (Sensitive Information Disclosure)",
    "llm07_insecure_plugin: tests covering OWASP LLM07 (Insecure Plugin Design)",
    "llm08_excessive_agency: tests covering OWASP LLM08 (Excessive Agency)",
    "safety_drift: tests covering compositional / session-level drift (fivedrisk-specific)",
    # OWASP Agentic Top 10 coverage markers (see owasp-agentic-top10-coverage.md)
    "asi01_goal_hijack: tests covering ASI01 Agent Goal Hijack",
    "asi02_tool_misuse: tests covering ASI02 Tool Misuse and Exploitation",
    "asi03_identity_abuse: tests covering ASI03 Identity and Privilege Abuse",
    "asi04_supply_chain: tests covering ASI04 Agentic Supply Chain Vulnerabilities",
    "asi05_code_execution: tests covering ASI05 Unexpected Code Execution",
    "asi06_context_manipulation: tests covering ASI06 Context Management and Retrieval Manipulation",
    "asi07_inter_agent_comm: tests covering ASI07 Insecure Inter-Agent Communication",
    "asi08_cascading: tests covering ASI08 Cascading Failures",
    "asi09_trust_exploit: tests covering ASI09 Human-Agent Trust Exploitation",
    "asi10_rogue_agent: tests covering ASI10 Rogue Agents",
    # MITRE ATLAS coverage markers (see mitre-atlas-coverage.md)
    "atlas_t0051: AML.T0051 LLM Prompt Injection (any sub-technique)",
    "atlas_t0051_000: AML.T0051.000 Direct Prompt Injection",
    "atlas_t0051_001: AML.T0051.001 Indirect Prompt Injection",
    "atlas_t0050: AML.T0050 Command and Scripting Interpreter",
    "atlas_t0057: AML.T0057 LLM Data Leakage",
    "atlas_t0048: AML.T0048 External Harms",
    "atlas_t0049: AML.T0049 Tool Misuse and Exploitation",
    "atlas_t0040: AML.T0040 ML Model Inference API Access",
    "atlas_t0024: AML.T0024 Exfiltration via ML Inference API",
    "atlas_t0064: AML.T0064 Cascading (compositional failure)",
]
