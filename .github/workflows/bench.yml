name: benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    runs-on: macos-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_TREE: ${{ github.workspace }}/.bench/base
      CANDIDATE_TREE: ${{ github.workspace }}/.bench/candidate

    steps:
      - name: Check out frozen base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench/base
          persist-credentials: false

      - name: Check out frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .bench/candidate
          persist-credentials: false

      - name: Initialize isolated paths
        run: |
          root="$RUNNER_TEMP/fivedrisk-paired-bench-$GITHUB_RUN_ID"
          echo "EVIDENCE=$root" >> "$GITHUB_ENV"
          echo "BASE_VENV=$root/base-venv" >> "$GITHUB_ENV"
          echo "CANDIDATE_VENV=$root/candidate-venv" >> "$GITHUB_ENV"

      - name: Verify identities and freeze benchmark instruments
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/driver" "$EVIDENCE/runs"
          test "$(git -C "$BASE_TREE" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$CANDIDATE_TREE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'base=%s\ncandidate=%s\n' "$BASE_SHA" "$CANDIDATE_SHA" | tee "$EVIDENCE/identities.txt"
          python3 - "$BASE_TREE/benchmarks/bench_ci.py" "$CANDIDATE_TREE/benchmarks/bench_ci.py" "$EVIDENCE" <<'PY'
          import ast
          import hashlib
          import sys
          from pathlib import Path

          def executable_dump(path: Path) -> str:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              if (
                  tree.body
                  and isinstance(tree.body[0], ast.Expr)
                  and isinstance(tree.body[0].value, ast.Constant)
                  and isinstance(tree.body[0].value.value, str)
              ):
                  tree.body.pop(0)  # Remove only the module docstring.
              return ast.dump(tree, annotate_fields=True, include_attributes=False)

          base_path, candidate_path, evidence_path = map(Path, sys.argv[1:])
          base_dump = executable_dump(base_path)
          candidate_dump = executable_dump(candidate_path)
          evidence_path.joinpath("base-executable-ast.txt").write_text(base_dump, encoding="utf-8")
          evidence_path.joinpath("candidate-executable-ast.txt").write_text(candidate_dump, encoding="utf-8")
          if base_dump != candidate_dump:
              raise SystemExit("benchmark executable AST differs from protected base")
          digest = hashlib.sha256(base_dump.encode()).hexdigest()
          evidence_path.joinpath("executable-ast-sha256.txt").write_text(f"{digest}\n", encoding="utf-8")
          PY
          cp "$BASE_TREE/benchmarks/bench_ci.py" "$EVIDENCE/driver/bench_ci.py"
          cp "$BASE_TREE/benchmarks/check_regression.py" "$EVIDENCE/driver/check_regression.py"
          if [ -f "$BASE_TREE/benchmarks/aggregate_results.py" ]; then
            cp "$BASE_TREE/benchmarks/aggregate_results.py" "$EVIDENCE/driver/aggregate_results.py"
            echo "aggregator=protected-base" | tee "$EVIDENCE/aggregator-source.txt"
          else
            test "$BASE_SHA" = "c22213b513d4be167a0704244ad08c54e4ed1984"
            cp "$CANDIDATE_TREE/benchmarks/aggregate_results.py" "$EVIDENCE/driver/aggregate_results.py"
            echo "aggregator=bootstrap-candidate-non-authoritative" | tee "$EVIDENCE/aggregator-source.txt"
          fi
          shasum -a 256 \
            "$BASE_TREE/benchmarks/bench_ci.py" \
            "$CANDIDATE_TREE/benchmarks/bench_ci.py" \
            "$EVIDENCE/driver/aggregate_results.py" \
            "$EVIDENCE/driver/check_regression.py" \
            | tee "$EVIDENCE/instrument-sha256.txt"

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: .bench/candidate/pyproject.toml

      - name: Build isolated wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 setuptools==82.0.1 wheel==0.47.0
          mkdir -p "$EVIDENCE/base-dist" "$EVIDENCE/candidate-dist"
          python -m build --wheel --no-isolation --outdir "$EVIDENCE/base-dist" "$BASE_TREE"
          python -m build --wheel --no-isolation --outdir "$EVIDENCE/candidate-dist" "$CANDIDATE_TREE"
          python -m venv "$BASE_VENV"
          python -m venv "$CANDIDATE_VENV"
          "$BASE_VENV/bin/python" -m pip install "$EVIDENCE"/base-dist/fivedrisk-*.whl
          "$CANDIDATE_VENV/bin/python" -m pip install "$EVIDENCE"/candidate-dist/fivedrisk-*.whl

      - name: Verify isolated imports and dependency parity
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/neutral"
          cd "$EVIDENCE/neutral"
          "$BASE_VENV/bin/python" -I -c 'import importlib.metadata as m, json, pathlib, sys, fivedrisk; p=pathlib.Path(fivedrisk.__file__).resolve(); root=pathlib.Path(sys.prefix).resolve(); assert p.is_relative_to(root), (p, root); print(json.dumps({"distribution": m.version("fivedrisk"), "module": str(p), "prefix": str(root)}, sort_keys=True))' | tee "$EVIDENCE/base-import.json"
          "$CANDIDATE_VENV/bin/python" -I -c 'import importlib.metadata as m, json, pathlib, sys, fivedrisk; p=pathlib.Path(fivedrisk.__file__).resolve(); root=pathlib.Path(sys.prefix).resolve(); assert p.is_relative_to(root), (p, root); print(json.dumps({"distribution": m.version("fivedrisk"), "module": str(p), "prefix": str(root)}, sort_keys=True))' | tee "$EVIDENCE/candidate-import.json"
          "$BASE_VENV/bin/python" -m pip freeze --all | grep -Eiv '^fivedrisk(==|[[:space:]]+@)' | LC_ALL=C sort > "$EVIDENCE/base-dependencies.txt"
          "$CANDIDATE_VENV/bin/python" -m pip freeze --all | grep -Eiv '^fivedrisk(==|[[:space:]]+@)' | LC_ALL=C sort > "$EVIDENCE/candidate-dependencies.txt"
          diff -u "$EVIDENCE/base-dependencies.txt" "$EVIDENCE/candidate-dependencies.txt" | tee "$EVIDENCE/dependency-diff.txt"

      - name: Run balanced paired benchmark
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/work/base-a" "$EVIDENCE/work/candidate-a" "$EVIDENCE/work/candidate-b" "$EVIDENCE/work/base-b"
          cd "$EVIDENCE/work/base-a"
          TMPDIR="$PWD" "$BASE_VENV/bin/python" -I "$EVIDENCE/driver/bench_ci.py" --runs 3 --json > "$EVIDENCE/runs/base-a.json"
          cd "$EVIDENCE/work/candidate-a"
          TMPDIR="$PWD" "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/bench_ci.py" --runs 3 --json > "$EVIDENCE/runs/candidate-a.json"
          cd "$EVIDENCE/work/candidate-b"
          TMPDIR="$PWD" "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/bench_ci.py" --runs 3 --json > "$EVIDENCE/runs/candidate-b.json"
          cd "$EVIDENCE/work/base-b"
          TMPDIR="$PWD" "$BASE_VENV/bin/python" -I "$EVIDENCE/driver/bench_ci.py" --runs 3 --json > "$EVIDENCE/runs/base-b.json"
          "$BASE_VENV/bin/python" -I "$EVIDENCE/driver/aggregate_results.py" --subject base "$EVIDENCE/runs/base-a.json" "$EVIDENCE/runs/base-b.json" > "$EVIDENCE/base-aggregate.json"
          "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/aggregate_results.py" --subject candidate "$EVIDENCE/runs/candidate-a.json" "$EVIDENCE/runs/candidate-b.json" > "$EVIDENCE/candidate-aggregate.json"

      - name: Verify frozen comparator and paired results
        run: |
          set -euo pipefail
          printf '%s\n' '{"env":{"cpu":"control","platform":"control","python":"control"},"scenarios":{"positive_control":{"p99_us":100}}}' > "$EVIDENCE/positive-control-base.json"
          printf '%s\n' '{"env":{"cpu":"control","platform":"control","python":"control"},"scenarios":{"positive_control":{"p99_us":131}}}' > "$EVIDENCE/positive-control-current.json"
          if "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/check_regression.py" "$EVIDENCE/positive-control-current.json" "$EVIDENCE/positive-control-base.json" --threshold 0.30 --min-abs-us 25; then
            echo "FAIL: frozen comparator unexpectedly accepted synthetic slowdown" >&2
            exit 1
          fi
          "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/check_regression.py" "$EVIDENCE/runs/candidate-a.json" "$EVIDENCE/runs/base-a.json" --threshold 0.30 --min-abs-us 25
          "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/check_regression.py" "$EVIDENCE/runs/candidate-b.json" "$EVIDENCE/runs/base-b.json" --threshold 0.30 --min-abs-us 25
          "$CANDIDATE_VENV/bin/python" -I "$EVIDENCE/driver/check_regression.py" \
            "$EVIDENCE/candidate-aggregate.json" \
            "$EVIDENCE/base-aggregate.json" \
            --threshold 0.30 --min-abs-us 25

      - name: Upload paired benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-bench-results-${{ github.run_id }}
          path: ${{ runner.temp }}/fivedrisk-paired-bench-${{ github.run_id }}
          if-no-files-found: error
