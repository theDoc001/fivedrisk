name: benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bench:
    # H5: run on macos-latest (arm64/Darwin) so the environment matches the
    # committed benchmarks/baselines/main.json (arm64/Darwin). With the
    # platform-matched baseline the regression comparison actually runs instead
    # of being skipped every PR.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[langgraph,dev]"

      - name: Run CI bench
        run: |
          # M13: --runs 5 median smooths single-run p99 noise so the regression
          # gate compares median-vs-median (the baseline is also median-of-5).
          # Low-18: run the bench ONCE and print a human summary from the captured
          # JSON, instead of running the full (now 5x) bench a second time.
          python benchmarks/bench_ci.py --runs 5 --json > bench_current.json
          python -c "import json; d=json.load(open('bench_current.json')); print(f\"env {d['env']} runs={d.get('runs',1)}\"); [print(f\"  {k:<40} p50={v['p50_us']:.1f} p95={v['p95_us']:.1f} p99={v['p99_us']:.1f} us\") for k,v in d['scenarios'].items()]"

      - name: Upload bench JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: bench_current.json

      - name: Regression check (against main baseline)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f benchmarks/baselines/main.json ]; then
            python benchmarks/check_regression.py \
              bench_current.json \
              benchmarks/baselines/main.json
          else
            echo "No baseline at benchmarks/baselines/main.json; skipping regression check."
            echo "To establish a baseline: download the bench-results artifact from a main-branch run and commit it as benchmarks/baselines/main.json."
          fi
