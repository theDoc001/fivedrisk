name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install non-editable package with dev + langgraph extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[langgraph,dev]"

      - name: Verify installed package provenance
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c 'from importlib import metadata; from pathlib import Path; import fivedrisk; assert Path(fivedrisk.__file__).resolve().parent == Path(metadata.distribution("fivedrisk").locate_file("fivedrisk")).resolve()'

      - name: Run pytest
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "$GITHUB_WORKSPACE/fivedrisk/tests" --import-mode=importlib -q --maxfail=10

      - name: Build and inspect runtime-only wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python tools/verify_wheel.py wheelhouse/fivedrisk-*.whl

  typescript-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install non-editable Python gateway
        run: python -m pip install .

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install TypeScript toolchain
        working-directory: clients/typescript
        run: npm ci

      - name: Run TypeScript release gate
        working-directory: clients/typescript
        run: npm run test:release
        env:
          FIVEDRISK_PY: ${{ env.pythonLocation }}/bin/python
