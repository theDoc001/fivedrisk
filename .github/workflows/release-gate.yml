name: Release window audit

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-window:
    name: release-window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit external mutation time
        run: python -I tools/release_window.py --action push

  hook-contract:
    name: hook-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tracked hook and gate
        run: |
          test -x .githooks/pre-push
          test -f tools/release_window.py
          grep -F 'python3 -I "$gate" --action push' .githooks/pre-push
