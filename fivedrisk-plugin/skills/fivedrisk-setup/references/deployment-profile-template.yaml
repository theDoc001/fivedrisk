# tools.items entries carry their own basis + confirmation_status, then use this shape:
# - basis: operator-stated
#   confirmation_status: proposed
#   name: {value: "example", basis: operator-stated, confirmation_status: proposed}
#   actions: {items: [], basis: unresolved, confirmation_status: unresolved}
#   data_classes: {items: [], basis: unresolved, confirmation_status: unresolved}
#   destinations: {items: [], basis: unresolved, confirmation_status: unresolved}
#   dimensions:
#     data_sensitivity: {value: null, basis: unresolved, confirmation_status: unresolved}
#     tool_privilege: {value: null, basis: unresolved, confirmation_status: unresolved}
#     reversibility: {value: null, basis: unresolved, confirmation_status: unresolved}
#     external_impact: {value: null, basis: unresolved, confirmation_status: unresolved}
#     autonomy_context: {value: null, basis: unresolved, confirmation_status: unresolved}
# Dimension values are integers 0..4, with higher always meaning more risk. Endpoint
# anchors: public->credentials/secrets; read-only->destructive/admin;
# trivially-undoable->irreversible; local-only->untrusted-external; direct-user-action
# ->fully-autonomous/no-human. Keep uncertain values null/unresolved; see
# references/deployment-intake.md for the full scoring rule.

