source:
  kind:
    value: goals_description
    basis: operator-stated
    confirmation_status: proposed
  raw_content_stored: false

agent:
  mission_summary: &unresolved_fact
    value: null
    basis: unresolved
    confirmation_status: unresolved
  framework: *unresolved_fact
  execution_boundary: *unresolved_fact
  unresolved: &unresolved_collection
    items: []
    basis: unresolved
    confirmation_status: unresolved

tools: *unresolved_collection
# tools.items entries carry their own basis + confirmation_status, then use this shape:
# - basis: operator-stated
#   confirmation_status: proposed
#   name: {value: "example", basis: operator-stated, confirmation_status: proposed}
#   actions: {items: [], basis: unresolved, confirmation_status: unresolved}
#   data_classes: {items: [], basis: unresolved, confirmation_status: unresolved}
#   destinations: {items: [], basis: unresolved, confirmation_status: unresolved}
#   dimensions: {data_sensitivity: *unresolved_fact, tool_privilege: *unresolved_fact,
#     reversibility: *unresolved_fact, external_impact: *unresolved_fact,
#     autonomy_context: *unresolved_fact}

acceptance_cases:
  allowed: *unresolved_collection
  approval_required: *unresolved_collection
  refused: *unresolved_collection
  sequences: *unresolved_collection

controls:
  approval_channel: *unresolved_fact
  audit_path: *unresolved_fact
  session_identity: *unresolved_fact
  retention_owner: *unresolved_fact
  tool_spend_envelope: *unresolved_fact
  observer_inference_budget: *unresolved_fact

observer:
  mode: *unresolved_fact
  routed_ambiguities: *unresolved_collection
  unavailable_disposition:
    value: block
    basis: unresolved
    confirmation_status: proposed
  thresholds_status: *unresolved_fact
  evidence_status:
    value: design_only
    basis: operator-stated
    confirmation_status: proposed
